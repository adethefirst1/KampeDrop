<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* First paint: lock install to the vendor board before any module runs. */
      (function () {
        var link = document.createElement('link')
        link.rel = 'manifest'
        link.href = '/manifest-vendor.webmanifest'
        document.head.appendChild(link)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Distinct from customer apple-touch-icon — iOS home screen uses this, not the webmanifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-vendor.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="KampeDrop Vendor — orders, menu, and business board for Badagry partners."
    />
    <meta name="theme-color" content="#06181c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KD Vendor" />
    <link rel="manifest" href="/manifest-vendor.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>KampeDrop Vendor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
